# Publishes the app to GitHub Pages whenever its page changes on main.
# The whole app runs in the browser, so Pages serves it as a static site that never sleeps.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "cocoa-webcam/app/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cocoa-webcam/app/static
      - id: deployment
        uses: actions/deploy-pages@v5
